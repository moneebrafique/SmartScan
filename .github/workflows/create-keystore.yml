name: Create signing key (run once)

on:
  workflow_dispatch:
    inputs:
      password:
        description: 'Keystore password (at least 6 characters)'
        required: true

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate keystore
        run: |
          keytool -genkeypair -v -keystore release.jks \
            -storepass "${{ inputs.password }}" -keypass "${{ inputs.password }}" \
            -alias smartscan -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=SmartScan"
          base64 -w 0 release.jks > KEYSTORE_BASE64.txt
      - uses: actions/upload-artifact@v4
        with:
          name: keystore-base64
          path: KEYSTORE_BASE64.txt
